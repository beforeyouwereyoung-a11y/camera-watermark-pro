name: 功能建议 · Feature request
description: 提出一个新功能或改进想法
title: "[Feature] 简要描述"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请说明“想解决什么问题”，而不只是“想要什么按钮”，
        这样更容易设计出合适的方案。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 现在遇到了什么不便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的想法 / 期望的行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或替代做法
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / 参考
      description: 截图、其他软件的类似效果、链接等
    validations:
      required: false
