name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  checks:
    name: Syntax & import checks (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ "3.13" ]

    env:
      # 避免 Windows 控制台默认 cp1252 打印中文时抛 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile (syntax check)
        run: python -m compileall -q app.py desktop_app.py core processor selftest.py smoke_test.py

      - name: Import smoke test
        run: python -c "import core, processor; print('imports ok:', core.APP_NAME)"

      - name: Validate template JSON files
        run: |
          python -c "import json,glob; files=sorted(glob.glob('config/templates/*.json')); [json.load(open(f,encoding='utf-8')) for f in files]; print('templates ok:', len(files))"
